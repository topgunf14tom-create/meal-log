name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write # 「最新版」リリースに APK を載せるため

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 署名鍵を毎回同じにする（違うと上書きインストールできず、データが消える）
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "署名鍵: Secret から復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 が未設定です。ビルドごとに署名が変わり、アップデート時にアンインストールが必要になります"
          fi

      - name: Prepare platform folders
        run: bash tool/setup.sh

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - run: flutter test

      # Gradle 本体のダウンロードが一時的に失敗する（504 など）ことがあるので最大3回試す
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "::warning::ビルド失敗（$i 回目）。60秒後に再試行します"
            sleep 60
          done
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk meal-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meal_log-apk
          path: meal-log.apk

      # スマホのブラウザから直接ダウンロードできるよう「最新版」リリースを更新
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest meal-log.apk \
            --title "最新版（${GITHUB_SHA::7}）" \
            --notes "main の最新コミットから自動ビルドしたAPKです。スマホで meal-log.apk をダウンロードしてインストールしてください。" \
            --latest
