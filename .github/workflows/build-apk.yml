name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write # 「最新版」リリースに APK を載せるため

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 署名鍵を毎回同じにする（違うと上書きインストールできず、データが消える）
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "署名鍵: Secret から復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 が未設定です。ビルドごとに署名が変わり、アップデート時にアンインストールが必要になります"
          fi

      - name: Prepare platform folders
        run: bash tool/setup.sh

      - run: flutter pub get

      # Gradle 本体・依存ライブラリを保存して次回から再利用（GitHub のダウンロードが不安定なときの対策）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle 本体を粘り強く先に取得し、ローカルのファイルから使わせる
      - name: Prefetch Gradle distribution
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's#\\:#:#g')
          NAME=$(basename "$URL" .zip)
          if ls ~/.gradle/wrapper/dists/"$NAME"/*/*.ok >/dev/null 2>&1; then
            echo "Gradle はキャッシュ済み: $NAME"
          else
            curl -fL --retry 15 --retry-all-errors --retry-delay 20 --connect-timeout 30 -o "$RUNNER_TEMP/gradle.zip" "$URL"
          fi
          # キャッシュと同じ置き場所になるよう、常にローカルファイルの URL にそろえる
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$RUNNER_TEMP/gradle.zip#" "$PROPS"
          grep distributionUrl "$PROPS"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - run: flutter test

      # 依存ライブラリのダウンロードが一時的に失敗する（504 など）ことがあるので最大5回試す
      - name: Build APK
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release && exit 0
            echo "::warning::ビルド失敗（$i 回目）。$((i * 60))秒後に再試行します"
            sleep $((i * 60))
          done
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk meal-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meal_log-apk
          path: meal-log.apk

      # スマホのブラウザから直接ダウンロードできるよう「最新版」リリースを更新
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest meal-log.apk \
            --title "最新版（${GITHUB_SHA::7}）" \
            --notes "main の最新コミットから自動ビルドしたAPKです。スマホで meal-log.apk をダウンロードしてインストールしてください。" \
            --latest
