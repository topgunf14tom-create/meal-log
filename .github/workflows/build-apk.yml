name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write # 「最新版」リリースに APK を載せるため

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 署名鍵を毎回同じにする（違うと上書きインストールできず、データが消える）
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "署名鍵: Secret から復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 が未設定です。ビルドごとに署名が変わり、アップデート時にアンインストールが必要になります"
          fi

      - name: Prepare platform folders
        run: bash tool/setup.sh

      # リリース版を Secret の鍵で明示的に署名する。
      # ~/.android/debug.keystore に置くだけでは使われず、ビルドごとに別の鍵になっていたため
      - name: Configure release signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_B64 が未設定です"; exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/ci.keystore
          ALIAS=$(keytool -list -keystore android/app/ci.keystore -storepass android | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          [ -n "$ALIAS" ] || { echo "::error::鍵を読めません（パスワード android 前提）"; exit 1; }
          echo "鍵の別名: $ALIAS"
          keytool -list -v -keystore android/app/ci.keystore -storepass android -alias "$ALIAS" | grep -E 'SHA256:' | head -1 | tee "$RUNNER_TEMP/expected_cert.txt"
          G=android/app/build.gradle.kts
          perl -0pi -e "s/(\n\s*buildTypes \{)/\n    signingConfigs {\n        create(\"ci\") {\n            storeFile = file(\"ci.keystore\")\n            storePassword = \"android\"\n            keyAlias = \"$ALIAS\"\n            keyPassword = \"android\"\n        }\n    }\n\1/" "$G"
          perl -pi -e 's/signingConfig = signingConfigs\.getByName\("debug"\)/signingConfig = signingConfigs.getByName("ci")/' "$G"
          grep -q 'getByName("ci")' "$G" || { echo "::error::build.gradle.kts の書き換えに失敗"; cat "$G"; exit 1; }
          sed -n '/signingConfigs {/,/^    }/p;/buildTypes {/,/^    }/p' "$G"

      - run: flutter pub get

      # Gradle 本体・依存ライブラリを保存して次回から再利用（GitHub のダウンロードが不安定なときの対策）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle 本体を粘り強く先に取得し、ローカルのファイルから使わせる
      - name: Prefetch Gradle distribution
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's#\\:#:#g')
          NAME=$(basename "$URL" .zip)
          if ls ~/.gradle/wrapper/dists/"$NAME"/*/*.ok >/dev/null 2>&1; then
            echo "Gradle はキャッシュ済み: $NAME"
          else
            # 公式（services.gradle.org）→ GitHub → 国内外のミラーの順に試し、公式の SHA-256 で検証する
            SHA=""
            for u in "https://services.gradle.org/distributions/$NAME.zip.sha256" "$URL.sha256"; do
              SHA=$(curl -fsL --retry 5 --retry-all-errors --retry-delay 10 "$u" | tr -d '[:space:]') && [ ${#SHA} -eq 64 ] && break
              SHA=""
            done
            ok=""
            for u in "https://services.gradle.org/distributions/$NAME.zip" "$URL" "https://mirrors.cloud.tencent.com/gradle/$NAME.zip"; do
              # ミラーは公式の SHA-256 で検証できるときだけ使う
              case "$u" in *tencent*) [ -n "$SHA" ] || continue;; esac
              echo "取得: $u"
              if curl -fL --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o "$RUNNER_TEMP/$NAME.zip" "$u"; then
                if [ -z "$SHA" ] || echo "$SHA  $RUNNER_TEMP/$NAME.zip" | sha256sum -c -; then ok=1; break; fi
              fi
            done
            [ -n "$ok" ] || { echo "::error::Gradle 本体を取得できませんでした"; exit 1; }
            if [ -z "$SHA" ]; then echo "::warning::SHA-256 を取得できず、公式の配布元から取得したものを検証なしで使いました"; fi
          fi
          # 版ごとのファイル名にする（gradle.zip 固定だと前の版の展開済みキャッシュが使われ続ける）
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$RUNNER_TEMP/$NAME.zip#" "$PROPS"
          grep distributionUrl "$PROPS"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - run: flutter test

      - name: Print previews
        if: github.ref != 'refs/heads/main'
        run: |
          ls -la build/preview || true
          for f in build/preview/*.png; do n=$(basename "$f"); base64 -w 3000 "$f" | sed "s|^|PV:$n:|"; done || true

      # 依存ライブラリのダウンロードが一時的に失敗する（504 など）ことがあるので最大5回試す
      - name: Build APK
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100)) --build-name=1.0.$GITHUB_RUN_NUMBER && exit 0
            echo "::warning::ビルド失敗（$i 回目）。$((i * 60))秒後に再試行します"
            sleep $((i * 60))
          done
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk meal-log.apk

      # 署名が Secret の鍵と一致しているか確認（違えば公開しない）
      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs meal-log.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F')
          EXPECTED=$(sed 's/.*SHA256: //; s/://g' "$RUNNER_TEMP/expected_cert.txt" | tr -d '[:space:]')
          echo "APK:    $ACTUAL"; echo "Secret: $EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::APK の署名が Secret の鍵と一致しません"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: meal_log-apk
          path: meal-log.apk

      # デザイン確認用のプレビュー画像（test/preview_test.dart が作る）
      - uses: actions/upload-artifact@v4
        with:
          name: design-preview
          path: build/preview/
          if-no-files-found: ignore


      # スマホのブラウザから直接ダウンロードできるよう「最新版」リリースを更新
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest meal-log.apk \
            --title "最新版（${GITHUB_SHA::7}）" \
            --notes "main の最新コミットから自動ビルドしたAPKです。スマホで meal-log.apk をダウンロードしてインストールしてください。" \
            --latest
